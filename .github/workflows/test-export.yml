name: Test matrix export

on:
  pull_request:
    paths:
      - "matrix_generator.html"
      - "scripts/test-export-enclosed-cells.cjs"
      - ".github/workflows/test-export.yml"
  push:
    branches: [main]
    paths:
      - "matrix_generator.html"
      - "scripts/test-export-enclosed-cells.cjs"
      - ".github/workflows/test-export.yml"

jobs:
  export-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/test-export-enclosed-cells.cjs
